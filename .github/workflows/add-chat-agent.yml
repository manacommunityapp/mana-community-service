package com.manacommunity.chat.config;

public final class ChatSecurityContext {

    private ChatSecurityContext() {}

    private static final ThreadLocal<UserContext> CONTEXT = new ThreadLocal<>();

    public static void set(UserContext context) { CONTEXT.set(context); }

    public static UserContext get() {
        UserContext ctx = CONTEXT.get();
        if (ctx == null) throw new SecurityException("ChatSecurityContext not initialized.");
        return ctx;
    }

    public static void clear() { CONTEXT.remove(); }

    public record UserContext(
            Long userId, Long communityId, String userRole,
            Long teamId, String displayName, boolean kycVerified
    ) {
        public boolean hasRole(String role) { return userRole != null && userRole.equalsIgnoreCase(role); }
        public boolean canWrite() { return hasRole("SUPER_ADMIN") || hasRole("AUCTION_TEAM_OWNER"); }
        public boolean isAdmin() { return hasRole("SUPER_ADMIN"); }
        public boolean isTeamOwner() { return hasRole("AUCTION_TEAM_OWNER"); }
        public boolean ownsTeam(Long checkTeamId) { return teamId != null && teamId.equals(checkTeamId); }
    }
}
