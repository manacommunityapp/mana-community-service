package com.manacommunity.chat.tool;

import com.fasterxml.jackson.databind.ObjectMapper;
import com.manacommunity.chat.config.ChatSecurityContext;
import com.manacommunity.chat.config.ChatSecurityContext.UserContext;
import jakarta.persistence.EntityManager;
import jakarta.persistence.PersistenceContext;
import org.slf4j.Logger;
import org.slf4j.LoggerFactory;
import org.springframework.ai.tool.annotation.Tool;
import org.springframework.ai.tool.annotation.ToolParam;
import org.springframework.stereotype.Component;
import org.springframework.transaction.annotation.Transactional;
import java.util.*;
import java.util.stream.Collectors;

/**
 * Community-scoped, read-only by default. No delete operations.
 * Write operations (admin-only) check role + require confirmation.
 * Every query includes AND c.communityId = :communityId.
 */
@Component
@Transactional(readOnly = true)
public class AuctionTools {

    private static final Logger log = LoggerFactory.getLogger(AuctionTools.class);
    @PersistenceContext private EntityManager em;
    private final ObjectMapper om;
    public AuctionTools(ObjectMapper om) { this.om = om; }

    private boolean ok(Long configId) {
        if (configId == null) return false;
        UserContext ctx = ChatSecurityContext.get();
        return em.createQuery("SELECT COUNT(c) FROM AuctionConfig c WHERE c.id = :cid AND c.communityId = :comId", Long.class)
                .setParameter("cid", configId).setParameter("comId", ctx.communityId()).getSingleResult() > 0;
    }
    private Map<String,Object> denied(String a) { return Map.of("error",true,"message","Access denied: "+a); }
    private Map<String,Object> noWrite() { return Map.of("error",true,"message","No write permission. Contact your admin."); }

    @Tool(description = "Search auction players by category, status, name, or price. Community-scoped, read-only.")
    public Object searchPlayers(
            @ToolParam(description = "Auction config ID") Long auctionConfigId,
            @ToolParam(required = false, description = "BATSMEN, BOWLERS, ALL_ROUNDERS, WICKET_KEEPERS") String category,
            @ToolParam(required = false, description = "QUEUED, SOLD, UNSOLD") String status,
            @ToolParam(required = false, description = "Player name (partial)") String playerName,
            @ToolParam(required = false, description = "Max base price") Long maxBasePrice,
            @ToolParam(required = false, description = "Max results (default 10)") Integer limit) {
        if (!ok(auctionConfigId)) return denied("auction not in your community");
        UserContext ctx = ChatSecurityContext.get();
        StringBuilder q = new StringBuilder("SELECT p.playerName,p.category,p.playerRole,p.age,p.basePrice,p.status,p.statsJson,p.queueOrder FROM AuctionPlayer p JOIN AuctionConfig c ON p.configId=c.id WHERE p.configId=:cid AND c.communityId=:comId");
        if (category!=null) q.append(" AND p.category=:cat");
        if (status!=null) q.append(" AND p.status=:st");
        if (playerName!=null) q.append(" AND LOWER(p.playerName) LIKE LOWER(:nm)");
        if (maxBasePrice!=null) q.append(" AND p.basePrice<=:mx");
        q.append(" ORDER BY p.queueOrder ASC");
        var qr = em.createQuery(q.toString(),Object[].class).setParameter("cid",auctionConfigId).setParameter("comId",ctx.communityId());
        if (category!=null) qr.setParameter("cat",category);
        if (status!=null) qr.setParameter("st",status);
        if (playerName!=null) qr.setParameter("nm","%"+playerName+"%");
        if (maxBasePrice!=null) qr.setParameter("mx",maxBasePrice);
        qr.setMaxResults(limit!=null?limit:10);
        return qr.getResultList().stream().map(r->{Map<String,Object> m=new LinkedHashMap<>();m.put("name",r[0]);m.put("category",r[1]);m.put("role",r[2]);m.put("age",r[3]);m.put("base_price",r[4]);m.put("status",r[5]);m.put("stats",parseStats((String)r[6]));m.put("queue_order",r[7]);return m;}).collect(Collectors.toList());
    }

    @Tool(description = "Check team budgets. Community-scoped, read-only. Team owners can filter to own team.")
    public Object checkTeamBudget(
            @ToolParam(description = "Auction config ID") Long auctionConfigId,
            @ToolParam(required = false, description = "Team name filter") String teamName,
            @ToolParam(required = false, description = "Only show current user's team") Boolean myTeamOnly) {
        if (!ok(auctionConfigId)) return denied("auction not in your community");
        UserContext ctx = ChatSecurityContext.get();
        StringBuilder q = new StringBuilder("SELECT t.id,t.teamName,t.ownerName,t.ownerUserId,t.colorHex,t.totalBudget,t.remainingBudget FROM AuctionTeam t JOIN AuctionConfig c ON t.configId=c.id WHERE t.configId=:cid AND c.communityId=:comId");
        if (Boolean.TRUE.equals(myTeamOnly)&&ctx.teamId()!=null) q.append(" AND t.id=:tid");
        if (teamName!=null) q.append(" AND LOWER(t.teamName) LIKE LOWER(:tn)");
        q.append(" ORDER BY t.teamName");
        var qr = em.createQuery(q.toString(),Object[].class).setParameter("cid",auctionConfigId).setParameter("comId",ctx.communityId());
        if (Boolean.TRUE.equals(myTeamOnly)&&ctx.teamId()!=null) qr.setParameter("tid",ctx.teamId());
        if (teamName!=null) qr.setParameter("tn","%"+teamName+"%");
        return qr.getResultList().stream().map(r->{long tot=((Number)r[5]).longValue();long rem=((Number)r[6]).longValue();Map<String,Object> m=new LinkedHashMap<>();m.put("team_name",r[1]);m.put("owner_name",r[2]);m.put("total_budget",tot);m.put("remaining_budget",rem);m.put("spent",tot-rem);m.put("utilization_pct",tot>0?Math.round((double)(tot-rem)/tot*100):0);m.put("is_my_team",ctx.userId().equals(r[3]!=null?((Number)r[3]).longValue():null));return m;}).collect(Collectors.toList());
    }

    @Tool(description = "Get auction status, config, and progress. Community-scoped, read-only.")
    public Object getAuctionStatus(@ToolParam(description = "Auction config ID") Long auctionConfigId) {
        if (!ok(auctionConfigId)) return denied("auction not in your community");
        UserContext ctx = ChatSecurityContext.get();
        var rows = em.createQuery("SELECT c.seasonName,c.auctionFormat,c.totalTeams,c.totalPlayers,c.budgetPerTeam,c.basePrice,c.bidIncrementDefault,c.bidTimerSeconds,c.rtmEnabled,c.unsoldRule,c.status FROM AuctionConfig c WHERE c.id=:cid AND c.communityId=:comId",Object[].class).setParameter("cid",auctionConfigId).setParameter("comId",ctx.communityId()).getResultList();
        if (rows.isEmpty()) return Map.of("error","Auction not found");
        Object[] c=rows.get(0);Map<String,Object> r=new LinkedHashMap<>();r.put("season_name",c[0]);r.put("format",c[1]);r.put("teams",c[2]);r.put("players",c[3]);r.put("budget_per_team",c[4]);r.put("base_price",c[5]);r.put("bid_increment",c[6]);r.put("bid_timer_sec",c[7]);r.put("rtm",c[8]);r.put("unsold_rule",c[9]);r.put("status",c[10]);
        var sc = em.createQuery("SELECT p.status,COUNT(p) FROM AuctionPlayer p WHERE p.configId=:cid GROUP BY p.status",Object[].class).setParameter("cid",auctionConfigId).getResultList();
        Map<String,Long> prog=new LinkedHashMap<>();sc.forEach(s->prog.put(((String)s[0]).toLowerCase(),((Number)s[1]).longValue()));r.put("progress",prog);return r;
    }

    @Tool(description = "Compare players side-by-side. Community-scoped, read-only.")
    public Object comparePlayers(@ToolParam(description = "Auction config ID") Long auctionConfigId, @ToolParam(description = "Player names (2-5)") List<String> playerNames) {
        if (!ok(auctionConfigId)) return denied("auction not in your community");
        UserContext ctx = ChatSecurityContext.get();
        List<Map<String,Object>> out=new ArrayList<>();
        for (String n:playerNames){var rs=em.createQuery("SELECT p.playerName,p.category,p.playerRole,p.age,p.basePrice,p.status,p.statsJson FROM AuctionPlayer p JOIN AuctionConfig c ON p.configId=c.id WHERE p.configId=:cid AND c.communityId=:comId AND LOWER(p.playerName) LIKE LOWER(:nm)",Object[].class).setParameter("cid",auctionConfigId).setParameter("comId",ctx.communityId()).setParameter("nm","%"+n+"%").setMaxResults(1).getResultList();
        if(rs.isEmpty()){out.add(Map.of("search_name",n,"error","Not found"));continue;}Object[] r=rs.get(0);Map<String,Object> m=new LinkedHashMap<>();m.put("name",r[0]);m.put("category",r[1]);m.put("role",r[2]);m.put("age",r[3]);m.put("base_price",r[4]);m.put("status",r[5]);m.put("stats",parseStats((String)r[6]));out.add(m);}return out;
    }

    @Tool(description = "Get upcoming player bidding queue. Community-scoped, read-only.")
    public Object getPlayerQueue(@ToolParam(description = "Auction config ID") Long auctionConfigId, @ToolParam(required = false, description = "Max results") Integer limit) {
        if (!ok(auctionConfigId)) return denied("auction not in your community");
        UserContext ctx = ChatSecurityContext.get();
        return em.createQuery("SELECT p.queueOrder,p.playerName,p.category,p.basePrice FROM AuctionPlayer p JOIN AuctionConfig c ON p.configId=c.id WHERE p.configId=:cid AND c.communityId=:comId AND p.status='QUEUED' ORDER BY p.queueOrder",Object[].class).setParameter("cid",auctionConfigId).setParameter("comId",ctx.communityId()).setMaxResults(limit!=null?limit:10).getResultList().stream().map(r->{Map<String,Object> m=new LinkedHashMap<>();m.put("queue_order",r[0]);m.put("player_name",r[1]);m.put("category",r[2]);m.put("base_price",r[3]);return m;}).collect(Collectors.toList());
    }

    @Tool(description = "List all auctions in user's community. Read-only.")
    public List<Map<String,Object>> listMyCommunityAuctions() {
        UserContext ctx = ChatSecurityContext.get();
        return em.createQuery("SELECT c.id,c.seasonName,c.auctionFormat,c.status,c.totalTeams,c.totalPlayers FROM AuctionConfig c WHERE c.communityId=:comId ORDER BY c.id DESC",Object[].class).setParameter("comId",ctx.communityId()).getResultList().stream().map(r->{Map<String,Object> m=new LinkedHashMap<>();m.put("id",r[0]);m.put("season",r[1]);m.put("format",r[2]);m.put("status",r[3]);m.put("teams",r[4]);m.put("players",r[5]);return m;}).collect(Collectors.toList());
    }

    @Tool(description = "[ADMIN ONLY] Update auction status. Requires confirmation. No deletes.")
    @Transactional public Object updateAuctionStatus(@ToolParam(description = "Auction config ID") Long auctionConfigId, @ToolParam(description = "DRAFT/ACTIVE/PAUSED/COMPLETED") String newStatus, @ToolParam(description = "Admin confirmed?") Boolean confirmed) {
        UserContext ctx = ChatSecurityContext.get();
        if (!ctx.isAdmin()) return noWrite();
        if (!ok(auctionConfigId)) return denied("auction not in your community");
        if (!Boolean.TRUE.equals(confirmed)) return Map.of("requires_confirmation",true,"message","Confirm status change to "+newStatus+"?");
        int u = em.createQuery("UPDATE AuctionConfig c SET c.status=:st WHERE c.id=:cid AND c.communityId=:comId").setParameter("st",newStatus).setParameter("cid",auctionConfigId).setParameter("comId",ctx.communityId()).executeUpdate();
        return Map.of("success",u>0,"new_status",newStatus);
    }

    @Tool(description = "[ADMIN ONLY] Reset UNSOLD players to QUEUED. Requires confirmation. Does NOT delete.")
    @Transactional public Object resetUnsoldPlayers(@ToolParam(description = "Auction config ID") Long auctionConfigId, @ToolParam(description = "Admin confirmed?") Boolean confirmed) {
        UserContext ctx = ChatSecurityContext.get();
        if (!ctx.isAdmin()) return noWrite();
        if (!ok(auctionConfigId)) return denied("auction not in your community");
        Long cnt = em.createQuery("SELECT COUNT(p) FROM AuctionPlayer p JOIN AuctionConfig c ON p.configId=c.id WHERE p.configId=:cid AND c.communityId=:comId AND p.status='UNSOLD'",Long.class).setParameter("cid",auctionConfigId).setParameter("comId",ctx.communityId()).getSingleResult();
        if (!Boolean.TRUE.equals(confirmed)) return Map.of("requires_confirmation",true,"unsold_count",cnt,"message","Move "+cnt+" unsold players back to queue?");
        int u = em.createQuery("UPDATE AuctionPlayer p SET p.status='QUEUED' WHERE p.configId=:cid AND p.status='UNSOLD' AND p.configId IN (SELECT c.id FROM AuctionConfig c WHERE c.id=:cid AND c.communityId=:comId)").setParameter("cid",auctionConfigId).setParameter("comId",ctx.communityId()).executeUpdate();
        return Map.of("success",true,"players_reset",u);
    }

    @SuppressWarnings("unchecked")
    private Map<String,Object> parseStats(String json) {
        if (json==null||json.isBlank()) return Map.of();
        try { return om.readValue(json,Map.class); } catch (Exception e) { return Map.of("raw",json); }
    }
