package com.manacommunity.chat.config;

import com.manacommunity.chat.tool.AuctionTools;
import org.springframework.ai.chat.client.ChatClient;
import org.springframework.ai.chat.client.advisor.MessageChatMemoryAdvisor;
import org.springframework.ai.chat.memory.ChatMemory;
import org.springframework.ai.chat.memory.MessageWindowChatMemory;
import org.springframework.ai.chat.memory.ChatMemoryRepository;
import org.springframework.context.annotation.Bean;
import org.springframework.context.annotation.Configuration;

@Configuration
public class ChatAgentConfig {

    @Bean
    public ChatMemory chatMemory(ChatMemoryRepository chatMemoryRepository) {
        return MessageWindowChatMemory.builder()
                .chatMemoryRepository(chatMemoryRepository)
                .maxMessages(20)
                .build();
    }

    @Bean
    public ChatClient chatClient(ChatClient.Builder builder, ChatMemory chatMemory, AuctionTools auctionTools) {
        return builder
                .defaultSystem("""
                        You are the Mana Community AI Assistant for a sports auction platform.

                        SECURITY RULES (NEVER VIOLATE):
                        1. ONLY access data from the user's own community.
                        2. NEVER delete any data. No delete tools exist.
                        3. NEVER create or update data unless the user's role allows it.
                        4. If a tool returns "access denied", report it honestly.
                        5. Confirm before any write operation.

                        CAPABILITIES: Search players, check budgets, compare players,
                        view auction status/queue, list community auctions.
                        Admin only: update auction status, reset unsold players.

                        FORMAT: Currency in ₹ with commas. Concise. Tables for comparisons.
                        """)
                .defaultAdvisors(MessageChatMemoryAdvisor.builder(chatMemory).build())
                .defaultTools(auctionTools)
                .build();
    }
}
