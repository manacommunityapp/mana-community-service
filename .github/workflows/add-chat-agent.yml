package com.manacommunity.chat.controller;

import com.manacommunity.chat.config.ChatUserPrincipal;
import com.manacommunity.chat.dto.ChatRequest;
import com.manacommunity.chat.dto.ChatResponse;
import com.manacommunity.chat.exception.ChatAccessDeniedException;
import com.manacommunity.chat.service.ChatAgentService;
import com.manacommunity.chat.validator.UserAccessValidator;
import com.manacommunity.chat.validator.UserAccessValidator.ValidatedUser;
import jakarta.validation.Valid;
import org.slf4j.Logger;
import org.slf4j.LoggerFactory;
import org.springframework.http.MediaType;
import org.springframework.http.ResponseEntity;
import org.springframework.security.access.prepost.PreAuthorize;
import org.springframework.security.core.Authentication;
import org.springframework.security.core.GrantedAuthority;
import org.springframework.web.bind.annotation.*;
import reactor.core.publisher.Flux;

@RestController
@RequestMapping("/api/v1/chat")
@CrossOrigin(origins = "${app.cors.allowed-origins:*}")
public class ChatController {

    private static final Logger log = LoggerFactory.getLogger(ChatController.class);
    private final ChatAgentService chatAgentService;
    private final UserAccessValidator accessValidator;

    public ChatController(ChatAgentService chatAgentService, UserAccessValidator accessValidator) {
        this.chatAgentService = chatAgentService;
        this.accessValidator = accessValidator;
    }

    @PostMapping
    @PreAuthorize("hasAnyAuthority('SUPER_ADMIN', 'AUCTION_TEAM_OWNER', 'PLAYER', 'VIEWER')")
    public ResponseEntity<ChatResponse> chat(@Valid @RequestBody ChatRequest request, Authentication auth) {
        ValidatedUser user = accessValidator.validateFullAccess(
                extractUserId(auth), extractCommunityId(auth), extractRole(auth), request.getAuctionConfigId());
        return ResponseEntity.ok(chatAgentService.chat(request, user));
    }

    @PostMapping(value = "/stream", produces = MediaType.TEXT_EVENT_STREAM_VALUE)
    @PreAuthorize("hasAnyAuthority('SUPER_ADMIN', 'AUCTION_TEAM_OWNER', 'PLAYER', 'VIEWER')")
    public Flux<String> chatStream(@Valid @RequestBody ChatRequest request, Authentication auth) {
        ValidatedUser user = accessValidator.validateFullAccess(
                extractUserId(auth), extractCommunityId(auth), extractRole(auth), request.getAuctionConfigId());
        return chatAgentService.chatStream(request, user);
    }

    private Long extractUserId(Authentication auth) {
        if (auth.getPrincipal() instanceof ChatUserPrincipal p) return p.getChatUserId();
        try { return Long.parseLong(auth.getName()); }
        catch (NumberFormatException e) {
            throw new ChatAccessDeniedException("Make your AppUser implement ChatUserPrincipal", 0L);
        }
    }

    private Long extractCommunityId(Authentication auth) {
        if (auth.getPrincipal() instanceof ChatUserPrincipal p) {
            Long id = p.getChatCommunityId();
            if (id == null) throw new ChatAccessDeniedException("Not assigned to any community", 0L);
            return id;
        }
        throw new ChatAccessDeniedException("Make your AppUser implement ChatUserPrincipal", 0L);
    }

    private String extractRole(Authentication auth) {
        if (auth.getPrincipal() instanceof ChatUserPrincipal p && p.getChatUserRole() != null)
            return p.getChatUserRole();
        return auth.getAuthorities().stream().map(GrantedAuthority::getAuthority)
                .map(a -> a.startsWith("ROLE_") ? a.substring(5) : a).findFirst().orElse("VIEWER");
    }
}
EOF

