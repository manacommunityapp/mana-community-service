name: Dev Deployment

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Application
        run: mvn clean package -DskipTests=true

      - name: Copy JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "target/*.jar"
          target: "/tmp/dev"

      - name: Copy Service File to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "deploy/backend-dev.service"
          target: "/tmp/dev"

      - name: Deploy Dev Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            # Create directories
            sudo mkdir -p /opt/mana-community/backend-dev
            sudo mkdir -p /var/log/mana-community-dev/archive
            sudo mkdir -p /etc/mana-community

            # Deploy JAR
            sudo cp /tmp/dev/target/*.jar \
              /opt/mana-community/backend-dev/manacommunity.jar

            # Deploy systemd service
            sudo cp /tmp/dev/deploy/backend-dev.service /etc/systemd/system/backend-dev.service
            sudo systemctl daemon-reload
            sudo systemctl enable backend-dev

            # Create env file if it doesn't exist
            if [ ! -f /etc/mana-community/env-dev ]; then
              echo "WARNING: /etc/mana-community/env-dev not found!"
              echo "Create it with at minimum: JASYPT_ENCRYPTOR_PASSWORD=<your-master-key>"
            fi

            # Restart service
            sudo systemctl restart backend-dev

            sleep 15

            # Verify deployment
            sudo systemctl status backend-dev --no-pager
            sudo systemctl is-active backend-dev

            # Verify log files
            echo ""
            echo "=== Dev log directory ==="
            ls -la /var/log/mana-community-dev/

            echo ""
            echo "=== Last 5 lines of mana-service.log ==="
            tail -5 /var/log/mana-community-dev/mana-service.log 2>/dev/null || echo "(not yet created)"

            echo ""
            echo "=== Active profile check ==="
            grep -m1 "active profile" /var/log/mana-community-dev/mana-service.log 2>/dev/null \
              || grep -m1 "profiles are active" /var/log/mana-community-dev/mana-service.log 2>/dev/null \
              || echo "Profile line not found yet — check journalctl -u backend-dev"

            # Cleanup temp files
            rm -rf /tmp/dev
