spring:
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo
  security:
    user:
      name: configuser
      password: configpassword

eureka:
  client:
    service-url:
      defaultZone: http://eureka:password@localhost:8761/eureka/
  instance:
    hostname: localhost

encrypt:
  key: dev-encrypt-key-not-for-production

logging:
  level:
    root: INFO
    com.manacommunity: DEBUG
    org.springframework.cloud.config: DEBUG
    org.springframework.security: DEBUG
