# ============================================================
# AI Service - AI/ML Features & Intelligent Automation
# Port: 8094
# ============================================================

server:
  port: 8094

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/mana_ai
    username: ${DB_USERNAME:mana_ai}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ai

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mana:
  ai:
    llm:
      provider: ${AI_LLM_PROVIDER:openai}
      openai:
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_MODEL:gpt-4o}
        max-tokens: 4096
        temperature: 0.7
      anthropic:
        api-key: ${ANTHROPIC_API_KEY:}
        model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
        max-tokens: 4096
    chatbot:
      enabled: true
      context-window: 10
      max-daily-requests-per-user: 100
      supported-languages:
        - en
        - hi
        - ta
        - te
        - kn
        - ml
      response-timeout-seconds: 30
    recommendation:
      enabled: true
      update-frequency-hours: 24
      min-data-points: 10
    anomaly-detection:
      enabled: true
      models:
        - energy-consumption
        - water-usage
        - security-patterns
        - maintenance-frequency
      alert-threshold: 0.95
      training-schedule-cron: "0 0 2 * * SUN"
    sentiment:
      enabled: true
      analyze-feedback: true
      analyze-complaints: true
    ocr:
      enabled: true
      supported-documents:
        - ID_PROOF
        - ADDRESS_PROOF
        - VEHICLE_RC
        - INVOICE
      provider: ${OCR_PROVIDER:tesseract}
    image-moderation:
      enabled: true
      nsfw-threshold: 0.8
    rate-limiting:
      requests-per-minute: 60
      tokens-per-minute: 100000

logging:
  level:
    com.manacommunity.ai: INFO
