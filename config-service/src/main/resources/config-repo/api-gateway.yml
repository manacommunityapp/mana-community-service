# ============================================================
# API Gateway - Spring Cloud Gateway Configuration
# Port: 8080
# ============================================================

server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              replenishRate: 50
              burstCapacity: 100
              requestedTokens: 1
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,GATEWAY_TIMEOUT,SERVICE_UNAVAILABLE
            methods: GET
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**
          filters:
            - StripPrefix=0
        - id: community-service
          uri: lb://community-service
          predicates:
            - Path=/api/v1/communities/**,/api/v1/units/**,/api/v1/announcements/**
          filters:
            - StripPrefix=0
        - id: finance-service
          uri: lb://finance-service
          predicates:
            - Path=/api/v1/billing/**,/api/v1/payments/**,/api/v1/invoices/**
          filters:
            - StripPrefix=0
        - id: maintenance-service
          uri: lb://maintenance-service
          predicates:
            - Path=/api/v1/maintenance/**,/api/v1/work-orders/**
          filters:
            - StripPrefix=0
        - id: communication-service
          uri: lb://communication-service
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/messages/**
          filters:
            - StripPrefix=0
        - id: amenity-service
          uri: lb://amenity-service
          predicates:
            - Path=/api/v1/amenities/**,/api/v1/bookings/**
          filters:
            - StripPrefix=0
        - id: visitor-service
          uri: lb://visitor-service
          predicates:
            - Path=/api/v1/visitors/**,/api/v1/gate-passes/**
          filters:
            - StripPrefix=0
        - id: parking-service
          uri: lb://parking-service
          predicates:
            - Path=/api/v1/parking/**
          filters:
            - StripPrefix=0
        - id: healthcare-service
          uri: lb://healthcare-service
          predicates:
            - Path=/api/v1/health/**,/api/v1/appointments/**
          filters:
            - StripPrefix=0
        - id: restaurant-service
          uri: lb://restaurant-service
          predicates:
            - Path=/api/v1/restaurants/**,/api/v1/orders/**,/api/v1/menus/**
          filters:
            - StripPrefix=0
        - id: marketplace-service
          uri: lb://marketplace-service
          predicates:
            - Path=/api/v1/marketplace/**,/api/v1/listings/**
          filters:
            - StripPrefix=0
        - id: sports-service
          uri: lb://sports-service
          predicates:
            - Path=/api/v1/sports/**,/api/v1/tournaments/**
          filters:
            - StripPrefix=0
        - id: security-service
          uri: lb://security-service
          predicates:
            - Path=/api/v1/security/**,/api/v1/incidents/**,/api/v1/patrols/**
          filters:
            - StripPrefix=0
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**,/api/v1/chatbot/**
          filters:
            - StripPrefix=0
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**,/api/v1/reports/**,/api/v1/dashboards/**
          filters:
            - StripPrefix=0
        - id: integration-service
          uri: lb://integration-service
          predicates:
            - Path=/api/v1/integrations/**,/api/v1/webhooks/**
          filters:
            - StripPrefix=0
        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/api/v1/documents/**
          filters:
            - StripPrefix=0
        - id: energy-service
          uri: lb://energy-service
          predicates:
            - Path=/api/v1/energy/**,/api/v1/meters/**,/api/v1/utilities/**
          filters:
            - StripPrefix=0
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
            allowedMethods: GET,POST,PUT,DELETE,PATCH,OPTIONS
            allowedHeaders: "*"
            exposedHeaders: Authorization,X-Tenant-ID,X-Request-ID
            allowCredentials: true
            maxAge: 3600

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mana:
  gateway:
    rate-limiting:
      enabled: true
      default-replenish-rate: 50
      default-burst-capacity: 100
    jwt:
      secret-key: ${JWT_SECRET_KEY:mana-jwt-secret-key-change-in-production-min-256-bits-long}
    public-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh
      - /api/v1/auth/forgot-password
      - /api/v1/auth/verify-email
      - /actuator/health

logging:
  level:
    com.manacommunity.gateway: INFO
    org.springframework.cloud.gateway: WARN
