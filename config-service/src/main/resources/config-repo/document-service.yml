# ============================================================
# Document Service - Document Management & Storage
# Port: 8097
# ============================================================

server:
  port: 8097

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/mana_document
    username: ${DB_USERNAME:mana_document}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: document

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mana:
  document:
    storage:
      provider: ${STORAGE_PROVIDER:local}
      local:
        base-path: ${LOCAL_STORAGE_PATH:/var/mana/documents}
      s3:
        bucket: ${S3_BUCKET:mana-documents}
        region: ${S3_REGION:ap-south-1}
        access-key: ${S3_ACCESS_KEY:}
        secret-key: ${S3_SECRET_KEY:}
        endpoint: ${S3_ENDPOINT:}
        presigned-url-expiry-minutes: 60
      gcs:
        bucket: ${GCS_BUCKET:mana-documents}
        project-id: ${GCS_PROJECT_ID:}
        credentials-file: ${GCS_CREDENTIALS_FILE:}
    upload:
      allowed-types:
        - application/pdf
        - image/jpeg
        - image/png
        - image/webp
        - application/msword
        - application/vnd.openxmlformats-officedocument.wordprocessingml.document
        - application/vnd.ms-excel
        - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      max-file-size-mb: 50
      virus-scan:
        enabled: ${VIRUS_SCAN_ENABLED:false}
        clamav-host: ${CLAMAV_HOST:localhost}
        clamav-port: ${CLAMAV_PORT:3310}
    categories:
      - BYLAWS
      - MEETING_MINUTES
      - FINANCIAL_STATEMENTS
      - NOC
      - IDENTITY_PROOF
      - OWNERSHIP_DEED
      - MAINTENANCE_REPORT
      - INSURANCE
      - COMPLIANCE
      - CIRCULAR
      - AGREEMENT
    versioning:
      enabled: true
      max-versions: 10
    access-control:
      enabled: true
      default-visibility: PRIVATE
    preview:
      enabled: true
      thumbnail-size: 256
      pdf-preview-pages: 3
    retention:
      default-years: 7
      auto-archive: true
      archive-after-years: 3
    search:
      full-text-enabled: true
      indexing-async: true

logging:
  level:
    com.manacommunity.document: INFO
