# ============================================================
# Integration Service - Third-Party Integrations
# Port: 8096
# ============================================================

server:
  port: 8096

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/mana_integration
    username: ${DB_USERNAME:mana_integration}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: integration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mana:
  integration:
    webhook:
      enabled: true
      max-retries: 5
      retry-backoff-ms: 2000
      timeout-seconds: 30
      signature-validation: true
      secret: ${WEBHOOK_SECRET:}
    rera:
      enabled: ${RERA_ENABLED:false}
      api-url: ${RERA_API_URL:}
      api-key: ${RERA_API_KEY:}
    government:
      municipality-api:
        enabled: false
        url: ${MUNICIPALITY_API_URL:}
      property-tax:
        enabled: false
        url: ${PROPERTY_TAX_API_URL:}
    accounting:
      tally:
        enabled: ${TALLY_ENABLED:false}
        host: ${TALLY_HOST:localhost}
        port: ${TALLY_PORT:9000}
      zoho-books:
        enabled: ${ZOHO_ENABLED:false}
        client-id: ${ZOHO_CLIENT_ID:}
        client-secret: ${ZOHO_CLIENT_SECRET:}
        org-id: ${ZOHO_ORG_ID:}
    smart-home:
      enabled: ${SMART_HOME_ENABLED:false}
      protocols:
        - MQTT
        - ZIGBEE
        - ZWAVE
      mqtt:
        broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
        client-id: mana-integration
    maps:
      provider: ${MAPS_PROVIDER:google}
      google:
        api-key: ${GOOGLE_MAPS_API_KEY:}
      geocoding:
        enabled: true
        cache-ttl-hours: 720
    calendar:
      google:
        enabled: false
        client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
      outlook:
        enabled: false
        client-id: ${OUTLOOK_CLIENT_ID:}
    erp:
      sap:
        enabled: false
        url: ${SAP_URL:}
    sync:
      batch-size: 500
      max-concurrent: 5
      failure-threshold: 10

logging:
  level:
    com.manacommunity.integration: INFO
