# ============================================================
# Parking Service - Parking Management & Allocation
# Port: 8088
# ============================================================

server:
  port: 8088

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/mana_parking
    username: ${DB_USERNAME:mana_parking}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: parking

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mana:
  parking:
    slot-types:
      - CAR
      - TWO_WHEELER
      - BICYCLE
      - EV_CHARGING
      - HANDICAPPED
      - VISITOR
    allocation:
      strategy: FIXED
      max-slots-per-unit: 2
      visitor-slots-percentage: 10
      allow-swap: true
    visitor-parking:
      enabled: true
      max-duration-hours: 12
      max-per-unit-per-day: 3
      pre-booking-enabled: true
    anpr:
      enabled: ${ANPR_ENABLED:false}
      camera-integration-url: ${ANPR_URL:}
      confidence-threshold: 0.85
    ev-charging:
      enabled: true
      rate-per-kwh: 12.0
      max-charging-hours: 8
    occupancy:
      real-time-tracking: true
      display-board-enabled: true
      alert-threshold-percentage: 90
    violation:
      enabled: true
      notify-admin: true
      auto-fine: false
      fine-amount: 500

logging:
  level:
    com.manacommunity.parking: INFO
