    # ── Rate limiting zones (dev — relaxed limits) ───────────────────────────
    # Include these in the http { } block of your dev nginx.conf
    # limit_req_zone $binary_remote_addr zone=public_api:10m rate=30r/m;
    # limit_req_zone $binary_remote_addr zone=apply_api:10m  rate=10r/m;
    # limit_req_zone $binary_remote_addr zone=auth_api:10m   rate=120r/m;

    # Dev API — proxies to Spring Boot dev backend (port 8081)
    location /dev-api/ {
        proxy_pass http://localhost:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public MW endpoints — rate-limited even in dev
    location = /dev-api/api/v1/mw/jobs {
        limit_req zone=public_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://localhost:8081/api/v1/mw/jobs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dev-api/api/v1/mw/pool/browse {
        limit_req zone=public_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://localhost:8081/api/v1/mw/pool/browse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/dev-api/api/v1/mw/passport/[0-9]+$ {
        limit_req zone=public_api burst=10 nodelay;
        limit_req_status 429;
        rewrite ^/dev-api(.*)$ $1 break;
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket for dev — STOMP/SockJS handshake
    location /dev-ws/ {
        proxy_pass http://localhost:8081/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
