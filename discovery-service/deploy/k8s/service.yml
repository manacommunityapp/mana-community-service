apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: community
  labels:
    app: discovery-service
    app.kubernetes.io/name: discovery-service
    app.kubernetes.io/part-of: community-platform
    app.kubernetes.io/component: infrastructure
spec:
  type: ClusterIP
  ports:
    - port: 8761
      targetPort: 8761
      protocol: TCP
      name: http
  selector:
    app: discovery-service
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service-headless
  namespace: community
  labels:
    app: discovery-service
    app.kubernetes.io/name: discovery-service
    app.kubernetes.io/part-of: community-platform
    app.kubernetes.io/component: infrastructure
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8761
      targetPort: 8761
      protocol: TCP
      name: http
  selector:
    app: discovery-service
  publishNotReadyAddresses: true
