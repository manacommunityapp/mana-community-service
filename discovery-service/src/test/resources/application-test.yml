server:
  port: 0

spring:
  application:
    name: discovery-service-test
  security:
    user:
      name: test
      password: test

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    enabled: true
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 1000
    response-cache-update-interval-ms: 1000
  instance:
    hostname: localhost
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: WARN
    com.manacommunity.discovery: DEBUG
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
