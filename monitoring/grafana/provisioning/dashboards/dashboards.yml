# Tells Grafana to load any dashboard JSON dropped in /var/lib/grafana/dashboards.
apiVersion: 1
providers:
  - name: 'Mana Community'
    orgId: 1
    folder: 'Mana Community'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
