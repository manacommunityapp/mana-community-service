server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: mana-community-service-json
    static_configs:
      - targets:
          - localhost
        labels:
          job: mana-service
          __path__: /var/log/mana/mana-service-json.log
    pipeline_stages:
      - json:
          expressions:
            traceId: traceId
            spanId: spanId
            correlationId: correlationId
            userId: userId
            level: level
            logger: logger_name
      - labels:
          level:
          traceId:
          userId:
