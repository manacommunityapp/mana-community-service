# ============================================================================
# Mana Community Service — nginx reverse proxy with rate limiting
# ============================================================================
# Rate zones (defined in http context, outside server block):
#   public_api  — unauthenticated MW browse/search endpoints: 10 req/min
#   apply_api   — job/pool application submit endpoints: 5 req/min
#   auth_api    — all other authenticated API endpoints: 60 req/min
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    # Public unauthenticated MW endpoints: strict 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/m;

    # Application submit endpoints: 5 req/min per IP (prevent spam)
    limit_req_zone $binary_remote_addr zone=apply_api:10m rate=5r/m;

    # All other authenticated API endpoints: 60 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth_api:10m rate=60r/m;

    # Log 429s at warn level
    limit_req_log_level warn;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream mana_service {
        server app:8081;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers ──────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"                          always;
        add_header X-Frame-Options         "DENY"                             always;
        add_header X-XSS-Protection        "1; mode=block"                    always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;

        server_tokens off;

        # ── Buffer / timeout hardening ────────────────────────────────────
        client_body_buffer_size     16k;
        client_header_buffer_size   1k;
        client_max_body_size        8m;
        large_client_header_buffers 4 8k;

        client_body_timeout   12s;
        client_header_timeout 12s;
        keepalive_timeout     15s;
        send_timeout          10s;

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;

        # ── Shared proxy headers macro ────────────────────────────────────
        # (repeated per location; nginx doesn't support include inside location)

        # ═════════════════════════════════════════════════════════════════
        # PUBLIC (unauthenticated) Mana Workforce endpoints
        # Rate: 10 req/min, burst 5, nodelay
        # ═════════════════════════════════════════════════════════════════

        # Community job board search
        location = /api/v1/mw/jobs {
            limit_req zone=public_api burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://mana_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Open pool / shift listings browse
        location = /api/v1/mw/pool/browse {
            limit_req zone=public_api burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://mana_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public skill passport by user ID
        location ~ ^/api/v1/mw/passport/[0-9]+$ {
            limit_req zone=public_api burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://mana_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ═════════════════════════════════════════════════════════════════
        # APPLICATION SUBMIT endpoints — tighter limit to prevent spam
        # Rate: 5 req/min, burst 2, nodelay
        # ═════════════════════════════════════════════════════════════════

        location ~ ^/api/v1/mw/jobs/listings/[0-9]+/apply$ {
            limit_req zone=apply_api burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://mana_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/mw/pool/listings/[0-9]+/apply$ {
            limit_req zone=apply_api burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://mana_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ═════════════════════════════════════════════════════════════════
        # HEALTH CHECK — no rate limit, suppress access log noise
        # ═════════════════════════════════════════════════════════════════

        location = /actuator/health {
            proxy_pass http://mana_service;
            proxy_set_header Host $host;
            access_log off;
        }

        # Block internal actuator endpoints entirely
        location /actuator/ {
            deny all;
            return 403;
        }

        # ═════════════════════════════════════════════════════════════════
        # ALL OTHER API endpoints — authenticated, relaxed limit
        # Rate: 60 req/min, burst 20, nodelay
        # ═════════════════════════════════════════════════════════════════

        location /api/ {
            limit_req zone=auth_api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://mana_service;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ═════════════════════════════════════════════════════════════════
        # Custom error pages — JSON bodies
        # ═════════════════════════════════════════════════════════════════

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"status":429,"error":"Too Many Requests","message":"Rate limit exceeded. Please slow down and try again."}';
        }

        error_page 403 = @forbidden;
        location @forbidden {
            default_type application/json;
            return 403 '{"status":403,"error":"Forbidden","message":"Access denied."}';
        }

        error_page 404 = @not_found;
        location @not_found {
            default_type application/json;
            return 404 '{"status":404,"error":"Not Found","message":"The requested resource was not found."}';
        }

        error_page 502 503 504 = @upstream_error;
        location @upstream_error {
            default_type application/json;
            return 503 '{"status":503,"error":"Service Unavailable","message":"The service is temporarily unavailable. Please try again later."}';
        }
    }
}
