spring:
  application:
    name: cpos-service

  datasource:
    url: jdbc:postgresql://localhost:5432/cpos_db
    username: ${DB_USERNAME:cpos_user}
    password: ${DB_PASSWORD:cpos_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Unused for now — no Redis/Elasticsearch instance provisioned locally, and
  # the matching starter dependencies are commented out in pom.xml. Re-enable
  # together when caching/search are actually wired up.
  # data:
  #   redis:
  #     host: ${REDIS_HOST:localhost}
  #     port: ${REDIS_PORT:6379}
  #     password: ${REDIS_PASSWORD:cpos_redis_pass}
  #     timeout: 2000ms
  #     lettuce:
  #       pool:
  #         max-active: 10
  #
  # elasticsearch:
  #   uris: ${ES_URI:http://localhost:9200}

server:
  port: 8090
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

cpos:
  jwt:
    secret: ${JWT_SECRET:cpos-super-secret-key-2026-enterprise-property-os}
    expiration: 86400000  # 24 hours
    refresh-expiration: 604800000  # 7 days
  app:
    name: CPOS
    version: 1.0.0
    cors-origins: "http://localhost:5174,http://localhost:3000"

logging:
  level:
    com.cpos: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/cpos_db
  # Unused for now — see the commented default-profile block above.
