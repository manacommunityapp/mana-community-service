# Dev profile — loaded when SPRING_PROFILES_ACTIVE=dev
logging:
  file:
    name: ${LOG_DIR:/var/log/mana-community-dev}/mana-service.log
  frontend:
    file: ${LOG_DIR:/var/log/mana-community-dev}/frontend.log
  database:
    file: ${LOG_DIR:/var/log/mana-community-dev}/database.log

spring:
  application:
    name: mana-community-service
  datasource:
    url: jdbc:postgresql://3.109.145.130:5432/manacommunity
    username: ENC(w7xhx3G74k7XQS/femg1JAqFNPid82G7EDgHPgNKAnXD84eDjo0FuY1ARHxWZmKRxsWKcg==)
    password: ENC(Tr9sRxR/C/HdqotCyVnS+Mbf/4d5V/gcZacjzmj/CrQGp3sAiazk5ZHqH2FLV4znHRATSWvfqqp4)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: manacommunity
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false

  # ── SMTP transport (Brevo relay for Dev) ────────────────────────────────
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:b5c45c001@smtp-brevo.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2

server:
  port: 8081

app:
  #insert-sample-data: ${APP_INSERT_SAMPLE_DATA:false}
  insert-sample-data: false
  # AI/Ollama integration — temporarily OFF (no Ollama server in the dev env).
  ai:
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://manacommunityhub.com,http://localhost:5173,http://localhost:3000}
  security:
    mock-auth-enabled: false
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
      issuer: ${JWT_ISSUER:mana-community}

  # ── File / Invoice Storage (AWS S3 for Lightsail Dev) ───────────────────
  storage:
    type: ${APP_STORAGE_TYPE:s3}
    s3:
      bucket: ${S3_BUCKET:manacommunityhub}
      region: ${S3_REGION:eu-north-1}
      access-key: ${S3_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY:YOUR_AWS_SECRET_KEY}

  # ── Centralized Media Service (S3-backed for Lightsail Dev) ─────────────
  media:
    s3:
      bucket: ${MEDIA_S3_BUCKET:manacommunityhub}
      region: ${MEDIA_S3_REGION:eu-north-1}
      access-key: ${MEDIA_S3_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
      secret-key: ${MEDIA_S3_SECRET_KEY:YOUR_AWS_SECRET_KEY}
      presigned-put-expiry-minutes: ${MEDIA_PRESIGNED_EXPIRY:15}
      presigned-get-expiry-minutes: ${MEDIA_DOWNLOAD_EXPIRY:60}
      # ── S3 key path patterns (defined in MediaKeyGenerator.java) ──────────
      # Variant sub-folders: original | thumbnail | medium | compressed
      #
      # events/      {communityId}/{eventId}/{titleSlug?}/{subContext}/original/{uuid}_{epochMs}.{ext}
      # communities/ {communityId}/{subContext}/{moduleId}/original/{uuid}_{epochMs}.{ext}
      #   feed post example: communities/2/feed_post/{postId}/original/{uuid}_{epochMs}.jpg
      # users/       {userId}/{titleSlug?}/{subContext}/original/{uuid}_{epochMs}.{ext}
      # marketplace/ {communityId}/{moduleId}/{titleSlug?}/{subContext}/original/{uuid}_{epochMs}.{ext}
      # sports/      {communityId}/{moduleId}/{titleSlug?}/{subContext}/original/{uuid}_{epochMs}.{ext}
      # finance/     {communityId}/{moduleId}/{titleSlug?}/{subContext}/original/{uuid}_{epochMs}.{ext}
      # complaints/  {communityId}/{moduleId}/{titleSlug?}/{subContext}/original/{uuid}_{epochMs}.{ext}
      # announcements/{communityId}/{moduleId}/{titleSlug?}/{subContext}/original/{uuid}_{epochMs}.{ext}
      # documents/   {communityId}/{moduleId}/{titleSlug?}/{subContext}/original/{uuid}_{epochMs}.{ext}
    cloudfront:
      domain: ${MEDIA_CF_DOMAIN:}
    limits:
      max-image-size-mb: ${MEDIA_MAX_IMAGE_MB:20}
      max-video-size-mb: ${MEDIA_MAX_VIDEO_MB:500}
      max-document-size-mb: ${MEDIA_MAX_DOC_MB:50}
