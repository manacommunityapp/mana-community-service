logging:
  file:
    name: ${LOG_DIR:/var/log/mana-community}/mana-service.log
  frontend:
    file: ${LOG_DIR:/var/log/mana-community}/frontend.log
  database:
    file: ${LOG_DIR:/var/log/mana-community}/database.log

spring:
  application:
    name: mana-community-service
  datasource:
    # Replace with your AWS RDS MySQL endpoint once deployed
    url: jdbc:postgresql://3.109.145.130:5432/manacommunity
    username: manauser
    password: manacommunity
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' automatically creates/modifies tables to match your @Entity classes
      #ddl-auto: create
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: manacommunity
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false

app:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  security:
    mock-auth-enabled: true
