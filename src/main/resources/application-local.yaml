logging:
  file:
    name: ${LOG_DIR:/var/log/mana-community}/mana-service.log
  frontend:
    file: ${LOG_DIR:/var/log/mana-community}/frontend.log
  database:
    file: ${LOG_DIR:/var/log/mana-community}/database.log

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mana@community@8008}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 'update' automatically creates/modifies tables to match your @Entity classes
      ddl-auto: create
      #ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        default_schema: manacommunity
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false


server:
  port: 8082

app:
  # AI/Ollama integration — temporarily OFF. Flip to true only after starting a
  # local Ollama server (`ollama pull llama3.1 && ollama serve`).
  ai:
    enabled: false
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  security:
    mock-auth-enabled: true


# CORS Configuration for React Frontend
cors:
  allowed-origins: "http://localhost:3000"