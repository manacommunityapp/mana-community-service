logging:
  file:
    name: ${LOG_DIR:/var/log/mana-community}/mana-service.log
  frontend:
    file: ${LOG_DIR:/var/log/mana-community}/frontend.log
  database:
    file: ${LOG_DIR:/var/log/mana-community}/database.log

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:mana@community@8008}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns database schema migrations.create,update Hibernate is set to 'validate'
      # so it verifies schema consistency without altering tables.
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        default_schema: manacommunity
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false

  flyway:
    enabled: true
    clean-disabled: false

  # ── Gmail SMTP (overrides AWS SES from application.yaml for local dev) ──
  # Uses Gmail's SMTP relay with an App Password. To generate one:
  #   1. Enable 2-Step Verification on your Google account
  #   2. Go to https://myaccount.google.com/apppasswords
  #   3. Create an App Password for "Mail" and paste it below
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:manacommunityapp@gmail.com}
    password: ${GMAIL_APP_PASSWORD:rygzuwgwbsvckiju}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8082

app:
  insert-sample-data: true # For inserting the sample data to a commmunity and other details for testing
  # AI/Ollama integration — temporarily OFF. Flip to true only after starting a
  # local Ollama server (`ollama pull llama3.1 && ollama serve`).
  ai:
    enabled: false
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  security:
    mock-auth-enabled: true
  storage:
    type: s3
    s3:
      bucket: ${S3_BUCKET:manacommunityhub}
      region: ${S3_REGION:eu-north-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

  # ── Centralized Media Service (S3-backed for Local Dev) ─────────────
  media:
    s3:
      bucket: ${MEDIA_S3_BUCKET:manacommunityhub}
      region: ${MEDIA_S3_REGION:eu-north-1}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
      presigned-put-expiry-minutes: ${MEDIA_PRESIGNED_EXPIRY:15}
      presigned-get-expiry-minutes: ${MEDIA_DOWNLOAD_EXPIRY:60}

  # ── Local email settings ─────────────────────────────────────────────
  # Enabled so emails are actually sent (not just logged).
  # REDIRECT mode sends all emails to default-recipient instead of real
  # users — safe for local testing.
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${GMAIL_USERNAME:manacommunityapp@gmail.com}
    from-name: Mana Community (Local)
    base-url: http://localhost:5173
    recipient-mode: REDIRECT
    default-recipient: ${GMAIL_USERNAME:manacommunityapp@gmail.com}

# CORS Configuration for React Frontend
cors:
  allowed-origins: "http://localhost:3000"