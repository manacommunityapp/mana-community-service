# Prod profile — loaded when SPRING_PROFILES_ACTIVE=prod
logging:
  file:
    name: ${LOG_DIR:/var/log/mana-community}/mana-service.log
  frontend:
    file: ${LOG_DIR:/var/log/mana-community}/frontend.log
  database:
    file: ${LOG_DIR:/var/log/mana-community}/database.log

spring:
  application:
    name: mana-community-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:3.109.145.130}:${DB_PORT:5432}/manacommunity
    username: ENC(w7xhx3G74k7XQS/femg1JAqFNPid82G7EDgHPgNKAnXD84eDjo0FuY1ARHxWZmKRxsWKcg==)
    password: ENC(Tr9sRxR/C/HdqotCyVnS+Mbf/4d5V/gcZacjzmj/CrQGp3sAiazk5ZHqH2FLV4znHRATSWvfqqp4)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: manacommunity
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false

  flyway:
    enabled: true
    clean-disabled: true
    out-of-order: false

server:
  port: 8081

app:
  # AI/Ollama integration — temporarily OFF (no Ollama server on the EC2 host).
  # Set AI_ENABLED=true only once a reachable Ollama endpoint is configured.
  ai:
    enabled: ${AI_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    mock-auth-enabled: false
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
      issuer: ${JWT_ISSUER:mana-community}

  # ── File / Invoice Storage (AWS S3 for Lightsail Prod) ──────────────────
  storage:
    type: ${APP_STORAGE_TYPE:s3}
    s3:
      bucket: ${S3_BUCKET:manacommunityhub}
      region: ${S3_REGION:ap-south-1}
      access-key: ${S3_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY:YOUR_AWS_SECRET_KEY}

  # ── Centralized Media Service (S3-backed for Lightsail Prod) ────────────
  media:
    s3:
      bucket: ${MEDIA_S3_BUCKET:manacommunityhub}
      region: ${MEDIA_S3_REGION:ap-south-1}
      access-key: ${MEDIA_S3_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
      secret-key: ${MEDIA_S3_SECRET_KEY:YOUR_AWS_SECRET_KEY}
      presigned-put-expiry-minutes: ${MEDIA_PRESIGNED_EXPIRY:15}
      presigned-get-expiry-minutes: ${MEDIA_DOWNLOAD_EXPIRY:60}
    cloudfront:
      domain: ${MEDIA_CF_DOMAIN:}
    limits:
      max-image-size-mb: ${MEDIA_MAX_IMAGE_MB:20}
      max-video-size-mb: ${MEDIA_MAX_VIDEO_MB:500}
      max-document-size-mb: ${MEDIA_MAX_DOC_MB:50}
