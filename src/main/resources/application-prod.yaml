spring:
  application:
    name: mana-community-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: manacommunity
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false

server:
  port: 8080

app:
  cors:
    # Comma-separated list of allowed origins — set via EC2 env var or override here
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    mock-auth-enabled: false
    # JWT_SECRET is REQUIRED in production (no default) — startup fails without it.
    jwt:
      secret: ${JWT_SECRET}
      # Short-lived access token (default 15 min) + long-lived refresh token (default 7 days).
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
      issuer: ${JWT_ISSUER:mana-community}
