logging:
  file:
    name: ${LOG_DIR:/var/log/mana-community}/mana-service.log
  frontend:
    file: ${LOG_DIR:/var/log/mana-community}/frontend.log
  database:
    file: ${LOG_DIR:/var/log/mana-community}/database.log

spring:
  application:
    name: mana-community-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://3.109.145.130:5432/manacommunity}
    username: ${DB_USERNAME:ENC(w7xhx3G74k7XQS/femg1JAqFNPid82G7EDgHPgNKAnXD84eDjo0FuY1ARHxWZmKRxsWKcg==)}
    password: ${DB_PASSWORD:ENC(Tr9sRxR/C/HdqotCyVnS+Mbf/4d5V/gcZacjzmj/CrQGp3sAiazk5ZHqH2FLV4znHRATSWvfqqp4)}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: manacommunity
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false

server:
  port: 8080

app:
  cors:
    # Comma-separated list of allowed origins — set via EC2 env var or override here
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    mock-auth-enabled: false
    # JWT_SECRET is REQUIRED in production (no default) — startup fails without it.
    jwt:
      secret: ${JWT_SECRET}
      # Short-lived access token (default 15 min) + long-lived refresh token (default 7 days).
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
      issuer: ${JWT_ISSUER:mana-community}
