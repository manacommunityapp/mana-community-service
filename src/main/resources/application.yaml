logging:
  # Patterns, appenders and rolling policy are defined in logback-spring.xml
  # (enterprise multi-file strategy with correlation id / user id on every line).
  # This path is kept so SystemLogController (/admin/logs dashboard) reads the
  # primary application log; it must match the APP appender file in logback-spring.xml.
  file:
    name: logs/mana-service.log

spring:
  application:
    name: mana-community-service

  # ── Flyway Database Migrations ─────────────────────────────────────────
  flyway:
    enabled: true
    schemas: manacommunity
    locations:
      - classpath:db/migration
      - classpath:db/seed
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "pre-flyway baseline schema"
    out-of-order: false
    validate-on-migrate: true
    clean-disabled: true


  # ── SMTP transport (used by JavaMailSender) ───────────────────────────
  # AWS SES SMTP via IAM user 'mailuser'. Real delivery only happens when
  # app.mail.enabled=true AND credentials are set via env vars.
  mail:
    host: ${MAIL_HOST:email-smtp.ap-south-1.amazonaws.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:YOUR_AWS_SMTP_USERNAME}
    password: ${MAIL_PASSWORD:YOUR_AWS_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2

  # ── Upload limits (file-upload hardening / DoS) ───────────────────────
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:55MB}

# ── HTTP server limits (mitigate large-payload DoS) ─────────────────────
server:
  tomcat:
    max-http-form-post-size: 55MB
    max-swallow-size: 55MB
  # Don't advertise the server build in the Server response header.
  server-header: ""
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

# ── Actuator / Micrometer (observability) ───────────────────────────────
# Endpoints are SECURED in SecurityConfig: /health + /info are public (for the
# load balancer / EC2 health check); everything else (metrics, prometheus…) is
# SUPER_ADMIN-only. A self-hosted Prometheus scrapes /actuator/prometheus
# (send a SUPER_ADMIN bearer token in the scrape config).
management:
  endpoints:
    web:
      exposure:
        # Only surface what we actually use; keep the rest off the HTTP surface.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Show component details (db, disk…) only to authenticated callers.
      show-details: when-authorized
  health:
    # SMTP is optional (off by default in dev) — its being DOWN must NOT mark the
    # whole app unhealthy and trip the load-balancer's 503. Liveness should reflect
    # the app + db + disk, not mail deliverability.
    mail:
      enabled: false
  metrics:
    tags:
      # Stamp every metric with the app name so multiple services are separable
      # in one Prometheus/Grafana instance.
      application: ${spring.application.name}

# ── Application-level email notification settings ───────────────────────
app:
  mail:
    # Set to true to enable email delivery via AWS SES.
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:no-reply@manacommunity.app}
    from-name: ${APP_MAIL_FROM_NAME:Mana Community}
    # Public base URL of the React app — used to build action links in emails.
    base-url: ${APP_MAIL_BASE_URL:http://localhost:5173}
    # Lead time before a match's start at which the self-match reminder is sent.
    match-reminder-lead-minutes: ${APP_MAIL_MATCH_REMINDER_LEAD:30}
    # Controls where notification emails are delivered:
    #   NONE     — send to the real recipient (production default)
    #   REDIRECT — send ALL emails to default-recipient instead of the real user
    #   CC       — send to the real recipient AND CC default-recipient
    recipient-mode: ${APP_MAIL_RECIPIENT_MODE:REDIRECT}
    # Default recipient address used when recipient-mode is REDIRECT or CC.
    default-recipient: ${APP_MAIL_DEFAULT_RECIPIENT:manacommunityapp@gmail.com}

  # ── SMS & WhatsApp (Twilio) ──────────────────────────────────────
  # When disabled (default), messages are logged but not sent — safe for dev.
  # Sign up at twilio.com/try-twilio for a free trial account.
  sms:
    enabled: ${SMS_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:}
    default-country-code: ${SMS_DEFAULT_COUNTRY_CODE:+91}

  # ── Weekly Schedule Digest ───────────────────────────────────────
  # Cron expression for the digest email job (default: Monday 7:00 AM).
  digest:
    cron: ${DIGEST_CRON:0 0 7 * * MON}

  # ── AI Chat Agent (Ollama) ───────────────────────────────────────
  ai:
    # Master switch. Gates the ENTIRE AI/Ollama integration (ChatClient,
    # /api/ai/** controller, rate-limit + metrics filters) via
    # @ConditionalOnProperty. When false, none of those beans are created and
    # the app has NO dependency on a running Ollama server. Default OFF; each
    # env yaml sets its own value. Flip to true only where an Ollama server is
    # reachable (see the spring.ai.ollama block below).
    enabled: ${AI_ENABLED:false}
    # Request throughput limits to protect LLM cost/load. Admins get 2x.
    rate-limit:
      per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}
      per-hour: ${AI_RATE_LIMIT_PER_HOUR:200}
      admin-multiplier: ${AI_RATE_LIMIT_ADMIN_MULTIPLIER:2}

  security:
    # ── JWT signing/verification ────────────────────────────────────────
    jwt:
      # MUST be overridden in production via the JWT_SECRET env var (>= 32 chars).
      # The default below is for local development ONLY — never ship it.
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
      # Short-lived access-token lifetime in ms (default 15 min). The React app
      # auto-refreshes via /api/auth/refresh before this expires.
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      # Long-lived refresh-token lifetime in ms (default 7 days).
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
      issuer: ${JWT_ISSUER:mana-community}
    # ── API rate limiting (DoS / brute-force protection) ──────────────────
    rate-limit:
      # Per client-IP fixed window of one minute. Generous by default so normal
      # UI usage is unaffected; lower it if you see abuse.
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_RPM:300}
      # Only enable when behind a trusted reverse proxy that sets X-Forwarded-For.
      # When false (default), the filter uses the TCP source address directly.
      trust-forwarded-header: ${RATE_LIMIT_TRUST_XFF:false}

  # ── File / Invoice Storage ──────────────────────────────────────────────
  # Two implementations: postgres | s3 (default: s3).
  storage:
    # postgres | s3
    type: ${APP_STORAGE_TYPE:s3}
    s3:
      bucket: ${S3_BUCKET:manacommunityhub}
      region: ${S3_REGION:ap-south-1}
      access-key: ${S3_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY:YOUR_AWS_SECRET_KEY}

  # ── Centralized Media Management Service (S3-backed) ─────────────────────
  media:
    s3:
      bucket: ${MEDIA_S3_BUCKET:manacommunityhub}
      region: ${MEDIA_S3_REGION:eu-north-1}
      access-key: ${S3_ACCESS_KEY:YOUR_AWS_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY:YOUR_AWS_SECRET_KEY}
      presigned-put-expiry-minutes: ${MEDIA_PRESIGNED_EXPIRY:15}
      presigned-get-expiry-minutes: ${MEDIA_DOWNLOAD_EXPIRY:60}
    cloudfront:
      domain: ${MEDIA_CF_DOMAIN:}
    limits:
      max-image-size-mb: ${MEDIA_MAX_IMAGE_MB:20}
      max-video-size-mb: ${MEDIA_MAX_VIDEO_MB:500}
      max-document-size-mb: ${MEDIA_MAX_DOC_MB:50}
    image:
      thumbnail-width: ${MEDIA_THUMB_WIDTH:400}
      medium-width: ${MEDIA_MEDIUM_WIDTH:1920}


  # ── Razorpay Payment Gateway ────────────────────────────────────────────
  # Gated by @ConditionalOnProperty(app.razorpay.enabled=true).
  # Test keys start with rzp_test_; live keys with rzp_live_.
  # Never commit real keys — supply them via environment variables.
  razorpay:
    enabled: ${RAZORPAY_ENABLED:false}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    currency: ${RAZORPAY_CURRENCY:INR}

  # ── Public event-registration anti-abuse (off by default) ─────────────
  # Both gates are no-ops unless enabled, so authenticated/admin add flows and
  # tests are unaffected. Turn on (and supply the reCAPTCHA secret) in prod.
  registration:
      recaptcha:
        enabled: ${RECAPTCHA_ENABLED:false}
        secret: ${RECAPTCHA_SECRET:}
        verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
      otp:
        enabled: ${REGISTRATION_OTP_ENABLED:false}
        length: ${REGISTRATION_OTP_LENGTH:6}
        ttl-minutes: ${REGISTRATION_OTP_TTL_MINUTES:10}
        max-sends-per-hour: ${REGISTRATION_OTP_MAX_SENDS:3}
        max-verify-attempts: ${REGISTRATION_OTP_MAX_ATTEMPTS:3}
        verified-window-minutes: ${REGISTRATION_OTP_VERIFIED_WINDOW:30}

  # CORS Configuration for React Frontend
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── AI Chat Agent (Ollama — free, runs locally) ──────────────────────
# Connection settings for the Ollama model. Only takes effect when
# app.ai.enabled=true (the master switch above); otherwise the AI beans that
# would consume this are never created. Ollama serves on port 11434 by default
# after `ollama pull llama3.1 && ollama serve`.
# To use Claude instead: swap spring-ai-starter-model-ollama for
# spring-ai-starter-model-anthropic in pom.xml, remove the ollama block below,
# and uncomment the anthropic block.
spring.ai:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat:
      model: ${OLLAMA_MODEL:llama3.1}
      options:
        temperature: 0.3
        num-predict: 2048
  # Uncomment to use Claude/Anthropic instead of Ollama:
  # anthropic:
  #   api-key: ${ANTHROPIC_API_KEY}
  #   chat:
  #     options:
  #       model: claude-sonnet-4-6
  #       temperature: 0.3
  #       max-tokens: 2048

